name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python tools/RepositoryPolicy/check.py
      - run: python -m unittest discover -s tests/RepositoryPolicy -p 'test_*.py'
      - run: python -m unittest discover -s tests/Deployment -p 'test_*.py'

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Methadrenaline.Server.Tests/Methadrenaline.Server.Tests.csproj -c Release --nologo
